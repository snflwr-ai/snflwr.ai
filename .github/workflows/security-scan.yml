name: Security Scanning

on:
  schedule:
    # Weekly, was nightly (0 2 * * *). The full scan is ~7-8 job-minutes;
    # nightly cost ~230 minutes a month of a 2,000-minute private-repo
    # allowance -- over a tenth of the budget re-scanning a tree that
    # often had not changed since the last run. Every push to main and
    # every PR still runs it, so a code change is never unscanned; this
    # schedule only exists to catch newly-published CVEs in unchanged
    # dependencies, and a week is a reasonable latency for that.
    - cron: '0 2 * * 1'
  # Same docs-only ignore list as ci.yml. Without it a one-line README fix paid
  # for a Docker build, Trivy and CodeQL on billed private-repo minutes, and a
  # docs change cannot introduce a vulnerability. The weekly schedule above
  # still scans the whole tree regardless.
  push:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: read
  security-events: write
  # Required by github/codeql-action, which calls GET /actions/runs/{run_id}.
  # An explicit `permissions:` block sets every scope it does NOT list to
  # `none`, so omitting this made that call fail with "Resource not accessible
  # by integration" and took the CodeQL job down on every run from 2026-09-18
  # until 2026-09-22 -- attributed the whole time to Advanced Security, which
  # the job log never mentioned. Read-only.
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pip-audit
      run: pip install pip-audit

    - name: Verify requirements.lock is in sync with requirements.txt
      # The Dockerfile installs ONLY from the lock, with --require-hashes, so a
      # package present in requirements.txt but missing from the lock is simply
      # absent from the built image. That happened (langfuse) and nothing caught
      # it. Containment check — no resolver, no network, cannot flake when an
      # unrelated transitive dependency publishes a release.
      run: python scripts/check_lock_sync.py

    - name: Check Python dependencies for vulnerabilities
      run: |
        pip install -r requirements.txt
        # Every manifest, not just requirements.txt. Auditing one of five is how
        # seven transitive vulnerabilities in requirements-usb.txt went unseen,
        # and how license-server/requirements.txt sat un-installable (an
        # unsatisfiable pytest pin) with a live CVE inside it.
        #
        # The former `--ignore-vuln PYSEC-2025-145` was removed 2026-09-09: that
        # advisory was WITHDRAWN upstream and has now aged out of pip-audit's
        # database, which is exactly the removal test the old comment specified.
        pip-audit --format json --output safety-report.json \
          || echo '[]' > safety-report.json

        status=0
        for manifest in requirements.txt requirements-dev.txt requirements-prod.txt \
                        requirements-usb.txt license-server/requirements.txt; do
          echo "--- pip-audit $manifest ---"
          pip-audit -r "$manifest" || status=1
        done
        exit "$status"

    - name: Upload vulnerability report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: safety-vulnerability-report
        path: safety-report.json

  code-security-scan:
    name: Code Security Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Bandit
      run: pip install bandit[toml]

    - name: Run Bandit security scan
      run: |
        # Generate the JSON report artifact (non-blocking).
        bandit -r api/ core/ safety/ storage/ utils/ \
          -f json -o bandit-report.json \
          --severity-level medium \
          --confidence-level medium || true
        # Enforce: fail on any medium+ severity / medium+ confidence finding.
        bandit -r api/ core/ safety/ storage/ utils/ \
          --severity-level medium \
          --confidence-level medium

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Full history for secret scanning

    - name: TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@v3.88.0
      with:
        extra_args: --only-verified

  docker-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    # main and the weekly schedule only. Measured 2026-09-23: 2.0 of 27.4
    # job-minutes per PR, and it builds the image a SECOND time (ci.yml's
    # Docker Build Test already builds it, and still runs on PRs, so a
    # Dockerfile that does not build is still caught at PR time).
    #
    # What this scan adds over the PR-time checks is base-OS CVEs, which change
    # when the base image or the lockfile changes -- not on a typical PR. Python
    # dependency CVEs are still caught on every PR by dependency-scan (pip-audit
    # over all five manifests), and newly-published CVEs by the weekly cron.
    if: github.event_name != 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image for scanning
      id: docker-build
      run: |
        docker build -f docker/Dockerfile -t snflwr-api:scan .

    - name: Run Trivy vulnerability scanner
      if: steps.docker-build.outcome == 'success'
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: 'snflwr-api:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true

    # The SARIF above is only readable in GitHub's code-scanning UI, which on a
    # private repo needs Advanced Security. Without this table the scan had no
    # visible output at all: on 2026-09-19 it was hiding a fixable CRITICAL
    # (anyio CVE-2026-63374) in the production image. Reuses Trivy's cached DB.
    - name: Show Trivy findings in the job summary
      if: steps.docker-build.outcome == 'success'
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: 'snflwr-api:scan'
        format: 'table'
        output: 'trivy-results.txt'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        skip-setup-trivy: true

    - name: Publish Trivy table
      if: always() && hashFiles('trivy-results.txt') != ''
      run: |
        { echo '### Trivy: fixable HIGH/CRITICAL in snflwr-api'; echo '```'; cat trivy-results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        cat trivy-results.txt
        if grep -qE '(CVE|GHSA)-' trivy-results.txt; then
          echo "::warning::Trivy found fixable HIGH/CRITICAL vulnerabilities in the image -- see the job summary"
        fi

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('trivy-results.sarif') != ''
      # Needs Advanced Security on a private repo (see codeql-analysis). The
      # table above is the readable output; this upload is a bonus when GHAS
      # is on and must not fail the job when it is off.
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    # Blocking again as of 2026-09-22, and it now reports on the CODE.
    #
    # It had carried continue-on-error since going private, which keeps the RUN
    # green while leaving the JOB red -- so every PR showed a red check that
    # gated nothing and said nothing. The recorded reason was "the SARIF upload
    # needs Advanced Security". That was never checked against the log: there is
    # no upload attempt and no GHAS error in it. The one fatal error is a
    # GET /actions/runs/{run_id} call refused for want of `actions: read`, fixed
    # in the permissions block above.
    #
    # The upload is skipped anyway (`upload: never`). Code scanning's UI does
    # need GHAS on a private repo, so instead of depending on an entitlement we
    # read the SARIF in the job and gate on it -- the same move the Trivy steps
    # above already make. Findings land in the job summary and as annotations.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
        queries: security-extended

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      id: codeql
      uses: github/codeql-action/analyze@v4
      with:
        # Absolute, so nothing depends on how a relative path is resolved or on
        # the action's sarif-output being populated when the upload is skipped.
        output: ${{ github.workspace }}/codeql-results
        # 'never' keeps the SARIF local. upload-database hits the same gated
        # API and nothing here consumes the database.
        upload: never
        upload-database: false

    - name: Gate on CodeQL findings
      # The SARIF is the only evidence the analysis ran, so a missing or
      # unreadable one FAILS rather than passing quietly. The script compares
      # findings against .github/codeql-baseline.json, which records every
      # accepted finding with the reason it was accepted.
      #
      # Scope is not cosmetic. On a pull_request codeql-action runs
      # DIFF-INFORMED -- it builds the whole database but reports only results
      # inside the changed line ranges ("Persisted 11 diff range(s) across 5
      # file(s)"). A PR touching none of the flagged files reports ZERO
      # findings, which against a full-tree baseline reads as "every entry
      # went stale" and fails every PR. So the stale-baseline half of the
      # ratchet runs only where the analysis actually looked everywhere.
      env:
        GATE_SCOPE: ${{ github.event_name == 'pull_request' && 'diff' || 'full' }}
      run: |
        python scripts/summarize_codeql_sarif.py \
          "${{ github.workspace }}/codeql-results" \
          .github/codeql-baseline.json \
          --scope "$GATE_SCOPE"

    - name: Upload CodeQL SARIF
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: codeql-sarif
        path: ${{ github.workspace }}/codeql-results
        if-no-files-found: warn

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security-scan, secret-scan, docker-security, codeql-analysis]
    if: always()

    steps:
    - name: Security Summary
      run: |
        echo "# Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Security | ${{ needs.code-security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker Security | ${{ needs.docker-security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY

    # codeql-analysis is back in this gate as of 2026-09-22. It was excluded
    # while its failure meant "this repo has no Advanced Security licence",
    # which must not fail a code review. It now means "CodeQL found something
    # that is not in the reviewed baseline", which must.
    # (This comment must stay OUTSIDE the `if: >-` block: inside a folded
    # scalar a `#` line is expression text, not a comment, and GitHub rejects
    # the whole workflow -- which is exactly what happened on 2026-09-18.)
    - name: Fail if any security scan failed
      if: >-
        needs.dependency-scan.result == 'failure' ||
        needs.code-security-scan.result == 'failure' ||
        needs.secret-scan.result == 'failure' ||
        needs.docker-security.result == 'failure' ||
        needs.codeql-analysis.result == 'failure'
      run: |
        echo "::error::One or more security scans failed. See summary above."
        exit 1
