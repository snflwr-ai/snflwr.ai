# Postgres HA via CloudNativePG — OPT-IN alternative to postgres-deployment.yaml.
#
# Prereq (once per cluster): install the CNPG operator (pinned v1.25.0):
#   kubectl apply --server-side -f \
#     https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.25/releases/cnpg-1.25.0.yaml
#
# Then:  kubectl apply -f postgres-cnpg.yaml   (do NOT also apply postgres-deployment.yaml)
# and uncomment POSTGRES_HOST: "snflwr-pg-rw" in configmap.yaml, then redeploy the API.
---
apiVersion: v1
kind: Secret
metadata:
  name: snflwr-pg-app
  namespace: snflwr-ai
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  # CNPG sets the 'snflwr' role's password from this secret. Keep in sync with
  # snflwr-secrets POSTGRES_PASSWORD (the app reads that one).
  username: snflwr
  password: "CHANGE-THIS-SECURE-PASSWORD"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: snflwr-pg
  namespace: snflwr-ai
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
  walStorage:
    size: 5Gi
  bootstrap:
    initdb:
      database: snflwr_db
      owner: snflwr
      secret:
        name: snflwr-pg-app
  # Declarative role management — CNPG reconciles these without a superuser Job.
  # Requires CNPG operator ≥1.20.  The openwebui role is intentionally non-superuser
  # and has no access to snflwr_db; it owns only the 'openwebui' Database (see
  # open-webui-db.yaml).  The password is read from the openwebui-db-app Secret,
  # which is also mounted into the Open WebUI Deployment for DATABASE_URL.
  managed:
    roles:
    - name: openwebui
      ensure: present
      login: true
      superuser: false
      createdb: false
      createrole: false
      passwordSecret:
        name: openwebui-db-app
  # ---------------------------------------------------------------------------
  # OFF-CLUSTER WAL ARCHIVING + PITR — OPT-IN (requires operator S3 credentials).
  #
  # This cluster is 3-node HA with local WAL storage as-is. Off-cluster archiving
  # (survives loss of the whole cluster / enables point-in-time recovery) is left
  # commented out ON PURPOSE: it cannot work without a real bucket + credentials,
  # and shipping placeholder values would make CNPG attempt archiving to a
  # non-existent bucket — a silent backup failure that reads as "PITR is on".
  #
  # To enable, do ALL of the following, then re-apply:
  #   1. Create the object-store bucket.
  #   2. kubectl create secret generic snflwr-pg-backup-creds -n snflwr-ai \
  #        --from-literal=ACCESS_KEY_ID=<id> --from-literal=SECRET_ACCESS_KEY=<key>
  #   3. Uncomment the `backup:` block below AND the ScheduledBackup at the end of
  #      this file, replacing the two <FILL-...> values with your real endpoint/path.
  # See enterprise/k8s/README.md ("Enable off-cluster PITR").
  # ---------------------------------------------------------------------------
  # backup:
  #   retentionPolicy: "30d"
  #   barmanObjectStore:
  #     destinationPath: "s3://<FILL-bucket>/snflwr-pg"
  #     endpointURL: "https://<FILL-s3-endpoint>"
  #     s3Credentials:
  #       accessKeyId:
  #         name: snflwr-pg-backup-creds
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: snflwr-pg-backup-creds
  #         key: SECRET_ACCESS_KEY
  #     wal:
  #       compression: gzip
  #     data:
  #       compression: gzip
# ---
# # Uncomment together with the `backup:` block above (PITR requires it).
# apiVersion: postgresql.cnpg.io/v1
# kind: ScheduledBackup
# metadata:
#   name: snflwr-pg-daily
#   namespace: snflwr-ai
# spec:
#   # CNPG uses 6-field cron (sec min hour dom mon dow): daily at 03:00 UTC.
#   schedule: "0 0 3 * * *"
#   immediate: true
#   backupOwnerReference: self
#   cluster:
#     name: snflwr-pg
