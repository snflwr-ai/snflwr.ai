name: Deploy Docs to GitHub Pages

on:
  # Automatic triggers removed 2026-09-18. GitHub Pages is unavailable for a
  # PRIVATE repository on a free organisation plan, so every docs/** push ran
  # this job only to fail at the deploy step. The site was already returning 404
  # with no custom domain, so nothing was being served to lose.
  # Kept, not deleted: re-enable the push trigger if the org upgrades or the
  # repo goes public again.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
