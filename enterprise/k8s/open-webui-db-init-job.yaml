# One-time Job: provision the 'openwebui' Postgres role + database on the CNPG cluster.
# Runs as the CNPG superuser so it can CREATE ROLE / CREATE DATABASE.
#
# Prerequisite: the CNPG Cluster must have spec.enableSuperuserAccess: true so
# CNPG generates the 'snflwr-pg-superuser' Secret.  Add the flag to
# postgres-cnpg.yaml and re-apply before running this Job.
#
# Usage (one-time, or re-run safely — SQL is idempotent):
#   kubectl apply -f enterprise/k8s/open-webui-db-init-job.yaml
#   kubectl -n snflwr-ai wait --for=condition=complete job/open-webui-db-init --timeout=120s
apiVersion: batch/v1
kind: Job
metadata:
  name: open-webui-db-init
  namespace: snflwr-ai
  labels:
    app: open-webui
    component: db-init
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: open-webui
        component: db-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
      - name: db-init
        image: postgres:16-alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        env:
        # CNPG superuser (enable spec.enableSuperuserAccess: true on the cluster)
        - name: PGHOST
          value: "snflwr-pg-rw"
        - name: PGUSER
          valueFrom:
            secretKeyRef: { name: snflwr-pg-superuser, key: username }
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: snflwr-pg-superuser, key: password }
        - name: PGDATABASE
          value: "postgres"
        - name: OWUI_DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: snflwr-secrets, key: OWUI_DB_PASSWORD }
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          psql -v ON_ERROR_STOP=1 --set=owui_pw="$OWUI_DB_PASSWORD" <<-'EOSQL'
            SELECT NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'openwebui') AS role_missing \gset
            \if :role_missing
                CREATE ROLE openwebui LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'owui_pw';
            \endif
          EOSQL
          if [ "$(psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'openwebui'")" != "1" ]; then
            psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE openwebui OWNER openwebui;"
          fi
          echo "open-webui-db-init: ensured role+database 'openwebui'."
