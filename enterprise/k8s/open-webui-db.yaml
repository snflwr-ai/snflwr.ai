# CNPG declarative Database resource for Open WebUI.
#
# Operator version requirements:
#   - spec.managed.roles (in postgres-cnpg.yaml) requires CNPG operator >= 1.20
#   - This Database CRD                          requires CNPG operator >= 1.24
#
# NOTE: the cluster imageName (ghcr.io/cloudnative-pg/postgresql:16.4) is the
# *Postgres* image version, NOT the operator version.  Confirm the installed
# operator with:  kubectl -n cnpg-system get deploy cnpg-controller-manager \
#                         -o jsonpath='{.spec.template.spec.containers[0].image}'
#
# The 'openwebui' role (declared in postgres-cnpg.yaml spec.managed.roles) owns
# this database.  It is a non-superuser role with no access to snflwr_db (child PII).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openwebui
  namespace: snflwr-ai
  labels:
    app: open-webui
spec:
  name: openwebui
  owner: openwebui
  cluster:
    name: snflwr-pg
