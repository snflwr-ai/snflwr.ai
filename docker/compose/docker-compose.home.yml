# snflwr.ai - Home Server / Self-Hosted Stack
#
# Single-command deployment for home servers and personal VPS.
# No model baking, no PostgreSQL, no nginx. Just run:
#
#   ./deploy.sh                  (auto-detects GPU, generates secrets)
#
# Or manually:
#   docker compose -f docker/compose/docker-compose.home.yml up -d
#   docker compose -f docker/compose/docker-compose.home.yml \
#                  -f docker/compose/docker-compose.gpu.yml up -d   (with GPU)
#
# For enterprise deployments (school/district) with PostgreSQL, Redis,
# nginx, and SSL, see docker/compose/docker-compose.yml instead.

services:

  # Ollama - AI inference engine (models pulled on first start)
  ollama:
    # Pinned (was :latest, which could change under you and break model loading
    # or the /api/tags format the proxy depends on). The guarded upgrader
    # (./deploy.sh --upgrade ollama) bumps OLLAMA_IMAGE_TAG, smoke-tests it, and
    # rolls back on failure.
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.30.9}
    container_name: snflwr-ollama
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      # backend only — OWUI (frontend-net) cannot reach Ollama directly; all
      # student LLM traffic must go through the snflwr-api safety proxy.
      - snflwr-backend-net
    expose:
      - "11434"
    # GPU acceleration: add -f docker-compose.gpu.yml (handled automatically by deploy.sh)
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # snflwr.ai Safety API - FastAPI backend with content filtering
  snflwr-api:
    image: snflwr-api:latest
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: snflwr-api
    volumes:
      - snflwr-home-data:/app/data
      - snflwr-home-logs:/app/logs
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Ollama — snflwr-api proxies OWU requests to the real Ollama backend
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_PROXY_TARGET=http://ollama:11434
      # Internal (server-to-server) Open WebUI URL for admin API calls (SSO
      # bridge, profile sync, family provisioning). OWUI is reachable on the
      # compose network at snflwr-frontend:8080; OPEN_WEBUI_URL stays browser-facing.
      - OPEN_WEBUI_INTERNAL_URL=${OPEN_WEBUI_INTERNAL_URL:-http://snflwr-frontend:8080}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_MODEL:-snflwr.ai}
      # Hold-back streaming (better TTFT; ~+1 output-classifier call/turn). Safe
      # to enable on a GPU box with headroom; default off keeps the buffered path.
      - CHAT_STREAMING_ENABLED=${CHAT_STREAMING_ENABLED:-false}
      # Pedagogy guidance-enforcer (homework-integrity): regenerate once to withhold
      # a revealed answer. Runs the confirm on every homework turn; fail-open.
      - GUIDANCE_ENFORCEMENT_ENABLED=${GUIDANCE_ENFORCEMENT_ENABLED:-false}
      - GUIDANCE_GATE_MODEL=${GUIDANCE_GATE_MODEL:-}
      # Identity the latency bar uses to reach the tutor as a real student.
      # The proxy fails CLOSED without a learning profile, so an unset value
      # makes scripts/latency_bar.py report UNMEASURED instead of timing the
      # no-profile refusal -- which it once scored as a passing 0.0s turn.
      - SNFLWR_CANARY_OWUI_USER_ID=${SNFLWR_CANARY_OWUI_USER_ID:-}
      # Content-safety classifier. CPU-pinned by default: same weights as the
      # GPU build (identical blob digest, only num_gpu differs) and measured at
      # 1.9s vs 1.8s, but immune to being evicted by the tutor or IronClaw's
      # brain -- after which the GPU build cold-loads for 2m27s on a path that
      # decides whether a child's message is about self-harm.
      # Names must match `ollama list` EXACTLY: _find_model does `in names`.
      # Default is the PUBLIC build so a fresh deployment works. This box sets
      # SAFETY_MODEL=llama-guard3-cpu:latest in .env.home -- a locally built
      # variant (same blob, num_gpu 0) that no fresh install would have.
      - SAFETY_MODEL=${SAFETY_MODEL:-llama-guard3:8b}
      - SAFETY_MODEL_FALLBACKS=${SAFETY_MODEL_FALLBACKS:-llama-guard3:8b,llama-guard3:1b}
      - GUIDANCE_GATE_TIMEOUT_S=${GUIDANCE_GATE_TIMEOUT_S:-6}
      - GUIDANCE_ENFORCER_CONFIRM_MODEL=${GUIDANCE_ENFORCER_CONFIRM_MODEL:-}
      # Keep in step with config.py's default -- compose's own default wins
      # over the code's, so a stale value here silently reverts the setting.
      # Guarded by tests/test_compose_defaults_match_config.py
      - GUIDANCE_ENFORCER_TIMEOUT_S=${GUIDANCE_ENFORCER_TIMEOUT_S:-15}
      # Found by the derived passthrough test, 2026-09-20: these two were read
      # by config.py and passed by nothing, so an operator could not tune the
      # enforcer's budget or retry count on the box it was written for.
      - GUIDANCE_ENFORCER_TOTAL_BUDGET_S=${GUIDANCE_ENFORCER_TOTAL_BUDGET_S:-40}
      - GUIDANCE_ENFORCER_MAX_REGEN_ATTEMPTS=${GUIDANCE_ENFORCER_MAX_REGEN_ATTEMPTS:-3}
      # --- Inference engine / serving plan -------------------------------
      # These MUST be passed through. The installer probes the context window
      # and writes INFERENCE_NUM_CTX to the env file, and the serving plan reads
      # it from the PROCESS environment -- so a value that stops at the env file
      # is a measurement nobody acts on. Verified 2026-09-18 on the reference
      # box: the probe found 24576, the env file said 24576, and the container
      # served 16384 because none of these were here.
      - INFERENCE_NUM_CTX=${INFERENCE_NUM_CTX:-}
      - INFERENCE_ENGINE=${INFERENCE_ENGINE:-auto}
      - INFERENCE_VRAM_GB=${INFERENCE_VRAM_GB:-}
      - INFERENCE_MAX_CONCURRENT=${INFERENCE_MAX_CONCURRENT:-}
      - INFERENCE_QUEUE_WAIT_S=${INFERENCE_QUEUE_WAIT_S:-20}
      - INFERENCE_MAX_QUEUE=${INFERENCE_MAX_QUEUE:-64}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000}
      - VLLM_MODEL=${VLLM_MODEL:-}
      # Remote inference (phase 2). Unset on a normal box; setting the URL makes
      # this install offload turns to a certified tutor server, and setting the
      # SERVER token makes this box serve them.
      - INFERENCE_REMOTE_URL=${INFERENCE_REMOTE_URL:-}
      - INFERENCE_REMOTE_TOKEN=${INFERENCE_REMOTE_TOKEN:-}
      - INFERENCE_REMOTE_PLAN_TTL_S=${INFERENCE_REMOTE_PLAN_TTL_S:-300}
      - INFERENCE_SERVER_TOKEN=${INFERENCE_SERVER_TOKEN:-}
      # Database - SQLite, no external dependency
      - DB_TYPE=sqlite
      - SNFLWR_DATA_DIR=/app/data
      - LOG_PATH=/app/logs
      # Redis disabled for home use (rate limiting falls back to in-memory)
      - REDIS_ENABLED=false
      # Security
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Optional GPU arbiter (host service) for boxes that share the card with
      # another Ollama. Empty = no co-tenant, and gpu_placement behaves exactly
      # as before. Point it at the gateway of THIS service's network:
      #   docker network inspect <net> --format '{{(index .IPAM.Config 0).Gateway}}'
      # host.docker.internal resolves to the DEFAULT bridge, which a compose
      # network cannot necessarily reach -- measured on the reference box.
      - SNFLWR_GPU_ARBITER_URL=${SNFLWR_GPU_ARBITER_URL:-}
      # Rotation window (scripts/rotate_internal_key.py): the API accepts the old
      # key too until OWU is reseeded. Never passed until 2026-09-19, so a
      # "zero-downtime" rotation was a hard cut on every compose deploy.
      - INTERNAL_API_KEY_PREVIOUS=${INTERNAL_API_KEY_PREVIOUS:-}
      - INTERNAL_API_KEY_CREATED_AT=${INTERNAL_API_KEY_CREATED_AT:-}
      - INTERNAL_API_KEY_MAX_AGE_DAYS=${INTERNAL_API_KEY_MAX_AGE_DAYS:-90}
      - PARENT_DASHBOARD_PASSWORD=${PARENT_DASHBOARD_PASSWORD}
      - ENCRYPT_CONVERSATIONS=true
      # Database encryption at rest (AES-256 via SQLCipher). The image ships
      # sqlcipher3-binary; the key must persist (it's in .env.home) or
      # encrypted data becomes unrecoverable across restarts.
      - DB_ENCRYPTION_ENABLED=${DB_ENCRYPTION_ENABLED:-true}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY}
      # API config
      - API_PORT=39150
      - API_HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # CORS - Open WebUI is on the same host
      - CORS_ORIGINS=http://localhost:${WEBUI_PORT:-3000},http://127.0.0.1:${WEBUI_PORT:-3000}
      # SMTP (optional - for parent alert emails)
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
    # host.docker.internal for tooling that expects it. NOTE it resolves to the
    # DEFAULT bridge gateway, not this network's, so it is not a substitute for
    # the arbiter URL above.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      # bridges both nets: reachable by OWUI (frontend) AND reaches Ollama (backend).
      - snflwr-frontend-net
      - snflwr-backend-net
    expose:
      - "39150"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:39150/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Open WebUI - Chat interface
  open-webui:
    # Pinned by default. The guarded upgrader (scripts/owui_upgrade.sh) bumps
    # OWU_IMAGE_TAG, smoke-tests the new version, and rolls this back to the
    # previous tag if the smoke test fails. v0.11.3 is the safety-reviewed pin
    # (2026-09-19): 0.10.x rendered the reasoning tutor's streamed answer BLANK
    # and was reverted; 0.11.3 was checked in a browser as a provisioned student
    # -- live render, block message, banner, model list -- before adopting it.
    image: ghcr.io/open-webui/open-webui:${OWU_IMAGE_TAG:-v0.11.3}
    container_name: snflwr-frontend
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # OWU talks to snflwr-api's Ollama proxy — NOT directly to Ollama.
      # Safety pipeline is enforced at the proxy layer.
      - OLLAMA_BASE_URL=http://snflwr-api:39150
      # Bearer for the proxy. snflwr-api accepts INTERNAL_API_KEY as a
      # server-to-server credential; without this, every chat returns 401.
      # NOTE (2026-06-18): Open WebUI v0.8.12 does NOT read this env for Ollama
      # connections — its OLLAMA_API_CONFIGS PersistentConfig is hardcoded to a
      # {} default (config.py:1039) and only loads the key from webui.db. The
      # key is therefore seeded into the DB (ollama.api_configs."0".key) by
      # deploy.sh via scripts/owui_connect.py after the container boots. This
      # env is kept for documentation / forward-compat only; it has no effect
      # on the Ollama connection in this version.
      - OLLAMA_API_KEY=${INTERNAL_API_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # No "new version available" nag — the OWUI version is a deliberate,
      # safety-reviewed pin (managed via the guarded upgrader), not something a
      # parent/student should be prompted to bump. Also avoids an outbound call
      # to GitHub on every load.
      - ENABLE_VERSION_UPDATE_CHECK=false
      # Forward user identity headers so the proxy can identify students
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
      # Self-signup stays off (students/parents don't self-register), but the
      # FIRST account still needs to be createable to bootstrap the admin. In
      # OWU v0.8.x that initial admin is gated behind ENABLE_INITIAL_ADMIN_SIGNUP
      # (env.py:460, default False) — without it the signup form 403s on a fresh
      # volume and there is no way in. Enable just the first-admin path.
      - ENABLE_INITIAL_ADMIN_SIGNUP=true
      - DEFAULT_USER_ROLE=user
      - DEFAULT_MODELS=${OLLAMA_MODEL:-snflwr.ai}
      # OWUI model access-control is redundant here and hides the tutor from
      # non-admin students: the snflwr-api proxy is the enforcement point — it
      # filters /api/tags per-student to only the snflwr.ai model AND runs the
      # full safety pipeline. Without this, OWUI 0.10 double-gates base models
      # and a student's model dropdown comes up EMPTY (can't select the tutor).
      - BYPASS_MODEL_ACCESS_CONTROL=true
      # Lock down student accounts - chat only
      - USER_PERMISSIONS_CHAT_CONTROLS=false
      - USER_PERMISSIONS_CHAT_VALVES=false
      - USER_PERMISSIONS_CHAT_SYSTEM_PROMPT=false
      - USER_PERMISSIONS_CHAT_PARAMS=false
      - USER_PERMISSIONS_CHAT_FILE_UPLOAD=false
      - USER_PERMISSIONS_CHAT_DELETE=false
      - USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS=false
      - USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS=false
      - USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS=false
      - USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=false
      - USER_PERMISSIONS_FEATURES_WEB_SEARCH=true
      - USER_PERMISSIONS_FEATURES_IMAGE_GENERATION=false
      - USER_PERMISSIONS_FEATURES_CODE_INTERPRETER=true
      - USER_PERMISSIONS_FEATURES_NOTES=false
      - USER_PERMISSIONS_FEATURES_CHANNELS=false
      - USER_PERMISSIONS_FEATURES_API_KEYS=false
      - USER_PERMISSIONS_FEATURES_MEMORIES=false
      - USER_PERMISSIONS_CHAT_SHARE=false
      - USER_PERMISSIONS_CHAT_EXPORT=false
      - USER_PERMISSIONS_CHAT_MULTIPLE_MODELS=false
      - USER_PERMISSIONS_CHAT_TEMPORARY=false
      - ENABLE_COMMUNITY_SHARING=false
      - ENABLE_EVALUATION_ARENA_MODELS=false
      # --- Open WebUI 0.10.x new-surface lockdown (kids' app) ---
      # 0.10 added team folder-sharing, per-user webhooks, automations, a
      # calendar, and a web/URL upload path. Lock every new student-reachable
      # surface: the safety proxy still mediates generation, but these avoid
      # outbound data egress and unvetted ingestion entirely. Set explicitly
      # even where the 0.10 default is already False, so an upstream default
      # flip can't silently reopen them.
      - USER_PERMISSIONS_CHAT_WEB_UPLOAD=false
      - USER_PERMISSIONS_CHAT_IMPORT=false
      - USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS=false
      - USER_PERMISSIONS_FEATURES_AUTOMATIONS=false
      - USER_PERMISSIONS_FEATURES_USER_WEBHOOKS=false
      - USER_PERMISSIONS_FEATURES_CALENDAR=false
      - USER_PERMISSIONS_FOLDERS_ALLOW_SHARING=false
      - USER_PERMISSIONS_CHAT_ALLOW_PUBLIC_SHARING=false
      - USER_PERMISSIONS_CALENDAR_ALLOW_PUBLIC_SHARING=false
      # Global kill-switches for 0.10 subsystems the tutor doesn't use
      - ENABLE_USER_WEBHOOKS=false
      - ENABLE_AUTOMATIONS=false
      - ENABLE_CALENDAR=false
      - ENABLE_NOTES=false
      - ENABLE_CHANNELS=false
      # OWUI 0.11 child-safety lockdown: plugins (admin-installed code; snflwr uses none,
      # and several 0.11 advisories are in plugin/tool handling), subagents, open sharing
      # and access grants. Off explicitly even where 0.11.3's default is already off.
      - ENABLE_PLUGINS=false
      - ENABLE_SUBAGENTS=false
      - USER_PERMISSIONS_CHAT_ALLOW_OPEN_SHARING=false
      - USER_PERMISSIONS_ACCESS_GRANTS_ALLOW_GROUPS=false
      - USER_PERMISSIONS_ACCESS_GRANTS_ALLOW_USERS=false
      - USER_PERMISSIONS_NOTES_ALLOW_SHARING=false
      - USER_PERMISSIONS_NOTES_ALLOW_PUBLIC_SHARING=false
      - ENABLE_TITLE_GENERATION=true
      - ENABLE_FOLLOW_UP_GENERATION=true
      - ENABLE_TAGS_GENERATION=true
      - ENABLE_AUTOCOMPLETE_GENERATION=false
      - SHOW_ADMIN_DETAILS=false
    depends_on:
      snflwr-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      # frontend only — talks to the snflwr-api proxy, never Ollama directly.
      - snflwr-frontend-net

  # Backup cron sidecar — the home stack runs no Celery Beat, so without this
  # the backup tooling never runs automatically (the enterprise stack schedules
  # it via celery-beat). Reuses the snflwr-api image (it has the script, deps
  # and the shared data volume); a plain sleep-until-hour loop avoids needing a
  # cron daemon OR the docker socket. Runs `backup_database.py backup` daily at
  # BACKUP_HOUR (default 03:00 local). Backups land in /app/data/backups (inside
  # the persisted snflwr-home-data volume); set OFFHOST_BACKUP_ENABLED + rclone
  # env in .env.home to also push them off-host (fail-closed).
  backup-cron:
    image: snflwr-api:latest
    container_name: snflwr-backup-cron
    working_dir: /app
    # Same entrypoint as the API image: fixes volume ownership, drops to the
    # non-root snflwr user, then execs this command.
    command:
      - /bin/sh
      - -c
      - |
        echo "[backup-cron] started; daily backup at ${BACKUP_HOUR:-03}:00"
        # Liveness heartbeat for the healthcheck below — touched every loop
        # iteration so a wedged loop goes stale (the inherited API image's
        # HTTP healthcheck does not apply to this sleep-loop sidecar).
        touch /tmp/backup-cron.alive
        while true; do
          touch /tmp/backup-cron.alive
          now=$$(date +%s)
          target=$$(date -d "${BACKUP_HOUR:-03}:00 today" +%s)
          [ "$$target" -le "$$now" ] && target=$$(date -d "${BACKUP_HOUR:-03}:00 tomorrow" +%s)
          sleep_for=$$((target - now))
          echo "[backup-cron] next backup in $${sleep_for}s"
          sleep "$$sleep_for"
          touch /tmp/backup-cron.alive
          echo "[backup-cron] running backup at $$(date -u +%FT%TZ)"
          python /app/scripts/backup_database.py backup \
            || echo "[backup-cron] backup FAILED (exit $$?) — see logs / heartbeat"
          # Retention purges and parents' daily safety digests are Celery beat
          # tasks, and this deploy runs no beat/worker/Redis -- they never ran.
          # Run the beat schedule without a broker, AFTER the backup so any
          # deletion follows a fresh snapshot.
          echo "[backup-cron] running maintenance at $$(date -u +%FT%TZ)"
          python /app/scripts/run_maintenance.py \
            || echo "[backup-cron] maintenance had FAILURES (exit $$?) — see logs"
        done
    volumes:
      - snflwr-home-data:/app/data
      - snflwr-home-logs:/app/logs
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DB_TYPE=sqlite
      - SNFLWR_DATA_DIR=/app/data
      - LOG_PATH=/app/logs
      - DB_ENCRYPTION_ENABLED=${DB_ENCRYPTION_ENABLED:-true}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY}
      # Backup behaviour (all optional; sane defaults). Set BACKUP_ENABLED=false
      # to keep the sidecar idle without removing it.
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_HOUR=${BACKUP_HOUR:-03}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      # Off-host (opt-in, fail-closed) — configure rclone in .env.home to enable.
      - OFFHOST_BACKUP_ENABLED=${OFFHOST_BACKUP_ENABLED:-false}
      - RCLONE_REMOTE=${RCLONE_REMOTE:-}
      - RCLONE_CONFIG=${RCLONE_CONFIG:-}
      - BACKUP_HEARTBEAT_URL=${BACKUP_HEARTBEAT_URL:-}
    depends_on:
      snflwr-api:
        condition: service_healthy
    # Override the API image's HTTP healthcheck (this sidecar serves no HTTP).
    # Healthy = the loop touched its heartbeat within the last ~26h (it touches
    # at least once per daily iteration); a wedged loop goes stale and unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/backup-cron.alive -mmin -1560 | grep -q . || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      # backend only — a backup sidecar, no need to reach OWUI.
      - snflwr-backend-net

volumes:
  ollama-data:
    driver: local
  open-webui-data:
    driver: local
  snflwr-home-data:
    driver: local
  snflwr-home-logs:
    driver: local

networks:
  # Two-tier segmentation enforces the safety model at the network layer:
  # OWUI sits on frontend-net only, Ollama on backend-net only, and snflwr-api
  # bridges both — so student LLM traffic can only reach Ollama THROUGH the
  # safety proxy, never directly. (Mirrors the enterprise-k8s OWUI NetworkPolicy.)
  snflwr-frontend-net:
    driver: bridge
  snflwr-backend-net:
    driver: bridge
